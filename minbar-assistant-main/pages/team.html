<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — টিম সদস্য</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .back-btn-wrap { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
    .member-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .member-row:last-child { border-bottom:none; }
    .member-avatar {
      width:40px; height:40px; border-radius:50%; background: var(--teal-800); color: var(--parchment);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
    }
    .member-info { flex:1; min-width:0; }
    .member-info h4 { margin:0 0 2px; font-size:14.5px; }
    .member-info p { margin:0; font-size:12px; color: var(--ink-muted); }
    .role-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--teal-800); white-space:nowrap; }
    .role-badge.owner { background: rgba(201,152,46,0.15); color: var(--gold-700); }
    .invite-box { display:flex; flex-direction:column; gap:10px; margin-top: var(--space-4); }
    .invite-box input, .invite-box select {
      width:100%; padding:11px 13px; border-radius: var(--radius-md); border:1.5px solid var(--border-strong);
      background: var(--surface); color: var(--ink); font-size:14.5px; font-family:inherit;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row back-btn-wrap">
        <button class="back-btn" onclick="window.location.href='settings.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="margin:0;">টিম সদস্য</h1>
      </div>
      <p>এই প্রতিষ্ঠানে কারা যুক্ত আছে</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="memberList"><p class="muted small">লোড হচ্ছে...</p></div>
      </div>

      <div class="card" id="inviteCard" style="box-shadow: var(--shadow-raised); margin-top:16px; display:none;">
        <h3 style="margin-top:0;">নতুন সদস্য যোগ করুন</h3>
        <p class="small muted">যাকে যোগ করতে চান তাকে আগে অ্যাপে অ্যাকাউন্ট খুলে তার প্রোফাইলে ফোন নম্বর দিতে বলুন, তারপর সেই নম্বর দিয়ে এখানে খুঁজুন।</p>
        <div class="invite-box">
          <input type="tel" id="inviteePhone" placeholder="01XXXXXXXXX" />
          <select id="inviteeRole">
            <option value="admin">অ্যাডমিন</option>
            <option value="imam">ইমাম</option>
            <option value="accountant">হিসাবরক্ষক</option>
            <option value="viewer" selected>দর্শক (শুধু দেখতে পারবে)</option>
          </select>
          <button class="btn btn--primary" onclick="inviteMember()">যোগ করুন</button>
        </div>
      </div>

      <p class="small muted text-center" style="margin-top:16px;" id="permNote"></p>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    let institutionId = null;
    let currentUserId = null;
    let isAdmin = false;

    const ROLE_LABELS = { owner: "👑 মালিক", admin: "অ্যাডমিন", imam: "ইমাম", accountant: "হিসাবরক্ষক", viewer: "দর্শক" };

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    async function loadMembers() {
      const { data: members, error } = await db
        .from("institution_members")
        .select("id, user_id, role, invited_at, profiles(full_name, phone)")
        .eq("institution_id", institutionId)
        .order("invited_at", { ascending: true });

      const listEl = document.getElementById("memberList");
      if (error || !members) {
        listEl.innerHTML = '<p class="muted small">তালিকা লোড করা যায়নি।</p>';
        return;
      }

      listEl.innerHTML = members
        .map((m) => {
          const name = m.profiles ? m.profiles.full_name || "নাম নেই" : "অজানা ইউজার";
          const initial = name.trim().charAt(0).toUpperCase() || "?";
          const isSelf = m.user_id === currentUserId;
          const canManage = isAdmin && m.role !== "owner";
          return `
          <div class="member-row">
            <div class="member-avatar">${escapeHtml(initial)}</div>
            <div class="member-info">
              <h4>${escapeHtml(name)}${isSelf ? " (আপনি)" : ""}</h4>
              <p>${escapeHtml((m.profiles && m.profiles.phone) || "")}</p>
            </div>
            ${
              canManage
                ? `<select class="role-badge" style="border:none;" onchange="changeRole('${m.id}', this.value)">
                    ${Object.entries(ROLE_LABELS).filter(([k]) => k !== "owner").map(([k, v]) => `<option value="${k}" ${m.role === k ? "selected" : ""}>${v}</option>`).join("")}
                  </select>
                  <button class="icon-btn" onclick="removeMember('${m.id}', '${escapeHtml(name)}')" title="সরিয়ে দিন">🗑️</button>`
                : `<span class="role-badge ${m.role}">${ROLE_LABELS[m.role] || m.role}</span>`
            }
          </div>`;
        })
        .join("");
    }

    async function inviteMember() {
      const phone = document.getElementById("inviteePhone").value.trim();
      const role = document.getElementById("inviteeRole").value;
      if (!phone) { await showAppAlert("ফোন নম্বর দিন।", "⚠️"); return; }

      const { data: found, error: lookupError } = await db.rpc("lookup_user_by_phone", { p_phone: phone });
      if (lookupError || !found || found.length === 0) {
        await showAppAlert("এই নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি। আগে তাকে অ্যাপে সাইন আপ করে প্রোফাইলে নম্বর দিতে বলুন।", "🔍");
        return;
      }

      const user = found[0];
      const confirmed = await showAppConfirm(user.full_name + "-কে " + ROLE_LABELS[role] + " হিসেবে যোগ করবেন?", "➕");
      if (!confirmed) return;

      const { error } = await db.from("institution_members").insert({ institution_id: institutionId, user_id: user.id, role });
      if (error) {
        await showAppAlert(
          error.code === "23505" ? "এই ইউজার আগে থেকেই টিমে আছেন।" : "যোগ করা যায়নি: " + error.message,
          "⚠️"
        );
        return;
      }
      document.getElementById("inviteePhone").value = "";
      await showAppAlert("যোগ হয়েছে ✅", "✅");
      loadMembers();
    }

    async function changeRole(memberId, newRole) {
      const { error } = await db.from("institution_members").update({ role: newRole }).eq("id", memberId);
      if (error) { await showAppAlert("পরিবর্তন করা যায়নি: " + error.message, "⚠️"); loadMembers(); return; }
    }

    async function removeMember(memberId, name) {
      const confirmed = await showAppConfirm(name + "-কে টিম থেকে সরিয়ে দেবেন?", "🗑️");
      if (!confirmed) return;
      const { error } = await db.from("institution_members").delete().eq("id", memberId);
      if (error) { await showAppAlert("সরানো যায়নি: " + error.message, "⚠️"); return; }
      loadMembers();
    }

    (async () => {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      currentUserId = user.id;
      const inst = await getCurrentInstitution();
      if (inst.status !== "ok") return;
      institutionId = inst.id;

      const { data: myRow } = await db
        .from("institution_members")
        .select("role")
        .eq("institution_id", institutionId)
        .eq("user_id", currentUserId)
        .maybeSingle();

      isAdmin = !!myRow && (myRow.role === "owner" || myRow.role === "admin");
      document.getElementById("inviteCard").style.display = isAdmin ? "block" : "none";
      document.getElementById("permNote").textContent = isAdmin
        ? "রোল বদলাতে ড্রপডাউনে ট্যাপ করুন। ভূমিকাগুলো এখন শুধু পরিচিতির জন্য — প্রতিটা ফিচারে আলাদা অনুমতি এখনো প্রযোজ্য নয়।"
        : "শুধু মালিক/অ্যাডমিন সদস্য যোগ বা অপসারণ করতে পারবেন।";

      loadMembers();
    })();
  </script>
</body>
</html>
