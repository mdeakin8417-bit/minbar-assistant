<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — বায়ান</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .search-box { position: relative; margin-bottom: var(--space-4); }
    .search-box input { padding-left: 40px; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }

    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-4); scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active { background: var(--teal-800); border-color: var(--teal-800); color: var(--parchment); }

    .bayan-card { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
    .bayan-card .bayan-cat {
      font-size: 11.5px; font-weight: 700; color: var(--gold-700);
      background: rgba(201,152,46,0.12); padding: 2px 9px; border-radius: var(--radius-pill);
      display: inline-block; margin-bottom: 4px;
    }
    .bayan-card h3 { margin-bottom: 2px; font-size: 16.5px; }
    .bayan-card .fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0; }

    .fab-wrapper {
      position: fixed; inset: 0; max-width: 480px; margin: 0 auto; pointer-events: none; z-index: 20;
    }
    .fab {
      position: absolute; pointer-events: auto;
      bottom: 88px; right: 20px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--gold-600);
      color: var(--teal-900);
      border: none;
      font-size: 28px;
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header" style="padding-bottom:36px;">
      <h1 data-i18n="bayanTitle">বায়ান</h1>
      <p data-i18n="bayanSubtitle">সংরক্ষিত সব বায়ান এক জায়গায়</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="বায়ান খুঁজুন..." data-i18n-placeholder="searchBayan" />
      </div>

      <div class="chip-row" id="categoryChips">
        <div class="chip active" data-cat="all" data-i18n="all">সব</div>
      </div>

      <div id="bayanList" class="stack">
        <p class="muted small text-center" data-i18n="loading">লোড হচ্ছে...</p>
      </div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <div style="font-size:36px;">📖</div>
        <p data-i18n="noBayan">এখনো কোনো বায়ান যোগ করা হয়নি।</p>
      </div>
    </main>

    <div class="fab-wrapper"><button class="fab" onclick="window.location.href='bayan-form.html'">+</button></div>

    <nav class="bottom-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="navHome">হোম</span>
      </a>
      <a href="bayan-list.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="navBayan">বায়ান</span>
      </a>
      <a href="dawat-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="navDawat">দাওয়াত</span>
      </a>
      <a href="finance-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span data-i18n="navFinance">হিসাব</span>
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="navSettings">সেটিংস</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    let allBayans = [];
    let activeCategory = "all";
    let institutionId = null;

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    function renderList() {
      const listEl = document.getElementById("bayanList");
      const emptyEl = document.getElementById("emptyState");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      let filtered = allBayans.filter((b) => {
        const matchesCat = activeCategory === "all" || b.category_id === activeCategory;
        const matchesQuery = !query || b.title.toLowerCase().includes(query) || (b.content || "").toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";

      listEl.innerHTML = filtered
        .map(
          (b) => `
        <div class="card bayan-card" onclick="window.location.href='bayan-detail.html?id=${b.id}'">
          <div style="flex:1; min-width:0;">
            ${b.category_name ? `<span class="bayan-cat">${escapeHtml(b.category_name)}</span>` : ""}
            <h3>${escapeHtml(b.title)}</h3>
            <p class="small muted" style="margin:0;">${escapeHtml(formatDate(b.bayan_date))}</p>
          </div>
          <button class="fav-btn" onclick="event.stopPropagation(); toggleFavorite('${b.id}', ${b.is_favorite})">${b.is_favorite ? "⭐" : "☆"}</button>
        </div>`
        )
        .join("");
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      const months = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
      return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
    }

    async function toggleFavorite(bayanId, isFav) {
      const user = await getCurrentUser();
      if (!user) return;
      if (isFav) {
        await db.from("bayan_favorites").delete().eq("bayan_id", bayanId).eq("user_id", user.id);
      } else {
        await db.from("bayan_favorites").insert({ bayan_id: bayanId, user_id: user.id });
      }
      loadBayans();
    }

    async function loadCategories() {
      const { data } = await db.from("bayan_categories").select("id, name").eq("institution_id", institutionId).order("name");
      const chipRow = document.getElementById("categoryChips");
      (data || []).forEach((cat) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.dataset.cat = cat.id;
        chip.textContent = cat.name;
        chip.addEventListener("click", () => selectChip(chip));
        chipRow.appendChild(chip);
      });
    }

    function selectChip(chip) {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.cat;
      renderList();
    }

    async function loadBayans() {
      const user = await getCurrentUser();
      const { data: bayans, error } = await db
        .from("bayans")
        .select("id, title, content, bayan_date, category_id, bayan_categories(name)")
        .eq("institution_id", institutionId)
        .order("bayan_date", { ascending: false });

      const { data: favorites } = await db.from("bayan_favorites").select("bayan_id").eq("user_id", user.id);
      const favSet = new Set((favorites || []).map((f) => f.bayan_id));

      if (error) {
        document.getElementById("bayanList").innerHTML = "";
        document.getElementById("emptyState").style.display = "block";
        return;
      }

      allBayans = (bayans || []).map((b) => ({
        ...b,
        category_name: b.bayan_categories ? b.bayan_categories.name : null,
        is_favorite: favSet.has(b.id),
      }));
      renderList();
    }

    document.getElementById("searchInput").addEventListener("input", renderList);
    document.querySelector('.chip[data-cat="all"]').addEventListener("click", function () {
      selectChip(this);
    });

    (async () => {
      const user = await getCurrentUser();
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      const inst = await getCurrentInstitution();
      if (inst.status === "error") { showConnectionError("প্রতিষ্ঠানের তথ্য লোড করা যায়নি।"); return; }
      if (inst.status === "empty") { window.location.replace("institution-setup.html"); return; }
      institutionId = inst.id;
      await loadCategories();
      await loadBayans();
    })();
  </script>
</body>
</html>
