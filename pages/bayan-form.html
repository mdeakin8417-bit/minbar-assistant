<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — নতুন বায়ান</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .file-drop {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 20px 14px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      cursor: pointer;
      background: var(--surface-sunken);
    }
    .file-drop.has-file { border-color: var(--gold-600); color: var(--teal-900); font-weight: 600; }
    .cat-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-chip {
      padding: 9px 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-strong);
      background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-muted); cursor: pointer;
    }
    .cat-chip.selected { background: var(--teal-800); border-color: var(--teal-800); color: var(--parchment); }
    .cat-chip.add-chip { border-style: dashed; color: var(--gold-700); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row" style="gap:10px; margin-bottom:6px;">
        <button class="back-btn" onclick="window.location.href='bayan-list.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <h1 style="margin:0;" data-i18n="newBayanTitle">নতুন বায়ান</h1>
      </div>
      <p data-i18n="bayanFormSubtitle">বায়ানের তথ্য পূরণ করুন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="alertBox" class="alert"></div>

        <form id="bayanForm" class="stack">
          <div class="field" id="titleField">
            <label for="title" data-i18n="bayanTitleLabel">শিরোনাম</label>
            <input type="text" id="title" placeholder="যেমন: সবরের ফজিলত" required />
            <div class="field-error">শিরোনাম লিখুন</div>
          </div>

          <div class="field">
            <label>ক্যাটাগরি</label>
            <div class="cat-grid" id="categoryGrid"></div>
            <input type="hidden" id="category" value="" />
          </div>

          <div class="field">
            <label for="bayanDate">তারিখ</label>
            <input type="date" id="bayanDate" />
          </div>

          <div class="field">
            <label for="content" data-i18n="bayanContent">বায়ানের লেখা (ঐচ্ছিক)</label>
            <textarea id="content" rows="6" placeholder="বায়ানের মূল বিষয়বস্তু লিখুন..."></textarea>
          </div>

          <div class="field">
            <label for="mediaLink" data-i18n="mediaLink">ইউটিউব / ফেসবুক ভিডিও লিংক (ঐচ্ছিক)</label>
            <input type="url" id="mediaLink" placeholder="https://youtube.com/... বা https://facebook.com/..." />
            <div class="field-hint">সংশ্লিষ্ট বায়ান ইউটিউব বা ফেসবুকে থাকলে এখানে লিংক দিন</div>
          </div>

          <div class="field">
            <label data-i18n="mediaFile">ছবি / PDF ফাইল যুক্ত করুন (ঐচ্ছিক)</label>
            <div class="file-drop" id="fileDrop" onclick="document.getElementById('mediaFile').click();">
              📎 ফাইল বাছাই করতে চাপুন
            </div>
            <input type="file" id="mediaFile" accept="image/*,application/pdf,video/*" style="display:none;" />
            <p class="small lang-bn" style="margin-top:6px; color:var(--gold-700);">
              🎬 প্রিমিয়াম নিলে সরাসরি ভিডিও ফাইলও যুক্ত করতে পারবেন — <a href="video-premium.html" style="color:var(--gold-700); font-weight:600;">বিস্তারিত দেখুন</a>
            </p>
            <p class="small lang-en" style="margin-top:6px; color:var(--gold-700); display:none;">
              🎬 With Premium, you can attach video files directly — <a href="video-premium.html" style="color:var(--gold-700); font-weight:600;">Learn more</a>
            </p>
          </div>

          <button type="submit" class="btn btn--primary" id="saveBtn">
            <span class="btn-label" data-i18n="save">সংরক্ষণ করুন</span>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    let institutionId = null;
    let currentUser = null;
    let videoQuotaMb = 0;
    let videoUsedMb = 0;

    const alertBox = document.getElementById("alertBox");
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = "alert show alert--" + type;
    }

    document.getElementById("bayanDate").valueAsDate = new Date();

    document.getElementById("mediaFile").addEventListener("change", async (e) => {
      const drop = document.getElementById("fileDrop");
      const file = e.target.files[0];
      if (!file) return;

      if (file.type.startsWith("video/")) {
        const fileMb = file.size / (1024 * 1024);
        if (videoQuotaMb <= 0) {
          e.target.value = "";
          await showAppAlert(
            "সরাসরি ভিডিও ফাইল আপলোড একটি প্রিমিয়াম ফিচার। এর বদলে উপরে ইউটিউব/ফেসবুক লিংক ব্যবহার করুন (ফ্রি), অথবা ভিডিও প্যাকেজ নিন।",
            "🎬"
          );
          setTimeout(() => { window.location.href = "video-premium.html"; }, 1800);
          return;
        }
        if (videoUsedMb + fileMb > videoQuotaMb) {
          e.target.value = "";
          const remaining = Math.max(0, videoQuotaMb - videoUsedMb).toFixed(0);
          await showAppAlert(
            "আপনার ভিডিও কোটা শেষের পথে — মাত্র " + remaining + " এমবি অবশিষ্ট আছে। প্যাকেজ বাড়াতে হবে।",
            "⚠️"
          );
          return;
        }
      }

      drop.textContent = "✅ " + file.name;
      drop.classList.add("has-file");
    });

    async function loadCategories() {
      const { data } = await db.from("bayan_categories").select("id, name").eq("institution_id", institutionId).order("name");
      renderCategoryChips(data || []);
    }

    function renderCategoryChips(categories) {
      const grid = document.getElementById("categoryGrid");
      document.getElementById("category").value = "";
      grid.innerHTML = "";
      categories.forEach((cat) => {
        const chip = document.createElement("div");
        chip.className = "cat-chip";
        chip.textContent = cat.name;
        chip.dataset.id = cat.id;
        chip.addEventListener("click", () => selectCategoryChip(chip));
        grid.appendChild(chip);
      });
      const addChip = document.createElement("div");
      addChip.className = "cat-chip add-chip";
      addChip.textContent = "➕ নতুন";
      addChip.addEventListener("click", addNewCategory);
      grid.appendChild(addChip);
    }

    function selectCategoryChip(chip) {
      document.querySelectorAll(".cat-chip").forEach((c) => c.classList.remove("selected"));
      chip.classList.add("selected");
      document.getElementById("category").value = chip.dataset.id;
    }

    async function addNewCategory() {
      const name = await showAppPrompt("নতুন ক্যাটাগরির নাম লিখুন:", "🏷️", "যেমন: সবর");
      if (!name || !name.trim()) return;
      const { data, error } = await db
        .from("bayan_categories")
        .insert({ institution_id: institutionId, name: name.trim() })
        .select()
        .single();
      if (error) { showAlert("ক্যাটাগরি যোগ করা যায়নি: " + error.message, "error"); return; }
      await loadCategories();
      const newChip = Array.from(document.querySelectorAll(".cat-chip")).find((c) => c.dataset.id === data.id);
      if (newChip) selectCategoryChip(newChip);
    }

    function detectMediaType(file) {
      if (file.type.startsWith("image/")) return "image";
      if (file.type === "application/pdf") return "pdf";
      if (file.type.startsWith("video/")) return "video";
      return null;
    }

    document.getElementById("bayanForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const titleField = document.getElementById("titleField");
      if (!title) {
        titleField.classList.add("has-error");
        return;
      }
      titleField.classList.remove("has-error");

      let categoryId = document.getElementById("category").value || null;
      if (categoryId === "__new__") categoryId = null;
      const bayanDate = document.getElementById("bayanDate").value || null;
      const content = document.getElementById("content").value.trim() || null;
      const mediaLink = document.getElementById("mediaLink").value.trim() || null;
      const file = document.getElementById("mediaFile").files[0];

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.querySelector(".btn-label").textContent = "সংরক্ষণ হচ্ছে...";

      const { data: bayan, error } = await db
        .from("bayans")
        .insert({
          institution_id: institutionId,
          category_id: categoryId,
          title,
          content,
          bayan_date: bayanDate,
          created_by: currentUser.id,
        })
        .select()
        .single();

      if (error) {
        btn.disabled = false;
        btn.querySelector(".btn-label").textContent = "সংরক্ষণ করুন";
        showAlert("সংরক্ষণ করা যায়নি: " + error.message, "error");
        return;
      }

      if (file) {
        const mediaType = detectMediaType(file);
        const path = institutionId + "/" + bayan.id + "/" + Date.now() + "_" + file.name;
        const { error: uploadError } = await db.storage.from("bayan-media").upload(path, file);
        if (!uploadError) {
          const { data: publicUrlData } = db.storage.from("bayan-media").getPublicUrl(path);
          await db.from("bayan_media").insert({
            bayan_id: bayan.id,
            media_type: mediaType,
            file_url: publicUrlData.publicUrl,
          });
          if (mediaType === "video") {
            const fileMb = Math.ceil(file.size / (1024 * 1024));
            await db.from("institutions").update({ video_used_mb: videoUsedMb + fileMb }).eq("id", institutionId);
          }
        }
      }

      if (mediaLink) {
        await db.from("bayan_media").insert({
          bayan_id: bayan.id,
          media_type: "link",
          file_url: mediaLink,
        });
      }

      window.location.href = "bayan-list.html";
    });

    (async () => {
      currentUser = await getCurrentUser();
      if (!currentUser) {
        window.location.replace("login.html");
        return;
      }
      const inst = await getCurrentInstitution();
      if (inst.status === "error") { showConnectionError("প্রতিষ্ঠানের তথ্য লোড করা যায়নি।"); return; }
      if (inst.status === "empty") { window.location.replace("institution-setup.html"); return; }
      institutionId = inst.id;
      videoQuotaMb = inst.institution.video_quota_mb || 0;
      videoUsedMb = inst.institution.video_used_mb || 0;
      await loadCategories();
    })();
  </script>
</body>
</html>
