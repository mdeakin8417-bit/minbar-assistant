<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — ইসলামিক ক্যালেন্ডার</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .back-btn-wrap { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
    .today-box {
      text-align:center; background: var(--teal-800); color: var(--parchment); border-radius: var(--radius-lg);
      padding: 22px 16px; margin-bottom: var(--space-5);
    }
    .today-box .hijri { font-size: 22px; font-weight:700; color: var(--gold-500); }
    .today-box .greg { font-size: 13px; opacity:0.85; margin-top:4px; }
    .event-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .event-row:last-child { border-bottom:none; }
    .event-row .icon { font-size:24px; flex-shrink:0; }
    .event-row h4 { margin:0 0 2px; font-size:14.5px; }
    .event-row p { margin:0; font-size:12.5px; color: var(--ink-muted); }
    .days-badge { flex-shrink:0; text-align:center; background: var(--surface-sunken); padding:6px 10px; border-radius: var(--radius-md); font-size:12px; font-weight:700; color: var(--teal-800); }
    .reminder-row { display:flex; justify-content:space-between; align-items:center; margin-top: var(--space-4); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row back-btn-wrap">
        <button class="back-btn" onclick="window.location.href='settings.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="margin:0;" data-i18n="islCalTitle">ইসলামিক ক্যালেন্ডার</h1>
      </div>
      <p data-i18n="islCalSubtitle">আজকের হিজরি তারিখ ও আসন্ন গুরুত্বপূর্ণ দিন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="today-box">
        <div class="hijri" id="todayHijri">—</div>
        <div class="greg" id="todayGreg">—</div>
      </div>

      <div class="card" style="box-shadow: var(--shadow-raised);">
        <h3 style="margin-top:0;" data-i18n="islCalUpcoming">আসন্ন গুরুত্বপূর্ণ দিন</h3>
        <div id="eventList"></div>
        <p class="small muted" style="margin-top:10px;" data-i18n="islCalNote">"সম্ভাব্য" লেখা তারিখগুলো গাণিতিক হিসাবে বের করা — চাঁদ দেখার ওপর নির্ভর করে বাস্তবে ১ দিন আগে-পিছে হতে পারে।</p>
      </div>

      <div class="card" style="box-shadow: var(--shadow-raised); margin-top:16px;">
        <div class="reminder-row">
          <div>
            <b data-i18n="islCalReminderTitle">রিমাইন্ডার নোটিফিকেশন</b>
            <p class="small muted" style="margin:2px 0 0;" data-i18n="islCalReminderSub">গুরুত্বপূর্ণ দিনের ৩ দিন আগে পুশ নোটিফিকেশন পাবেন</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="reminderToggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/hijri.js"></script>
  <script>
    applyTranslations();
    let institutionId = null;

    const HIJRI_MONTHS_EN = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Awwal","Jumada al-Thani","Rajab","Shaban","Ramadan","Shawwal","Dhul-Qadah","Dhul-Hijjah"];
    const GREG_MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
    const GREG_MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    // hijri.js-এর বাংলা নামের সাথে মিলিয়ে ইংরেজি অনুবাদ (আইকন দিয়ে হুবহু, নাম দিয়ে লুকআপ)
    const EVENT_NAME_EN = {
      "হিজরি নববর্ষ": "Islamic New Year",
      "আশুরা": "Ashura",
      "ঈদে মিলাদুন্নবী (সম্ভাব্য)": "Eid Milad-un-Nabi (estimated)",
      "শবে বরাত": "Shab-e-Barat",
      "রমজান শুরু (সম্ভাব্য)": "Ramadan start (estimated)",
      "ঈদুল ফিতর (সম্ভাব্য)": "Eid-ul-Fitr (estimated)",
      "আরাফাহ দিবস (সম্ভাব্য)": "Day of Arafah (estimated)",
      "ঈদুল আযহা (সম্ভাব্য)": "Eid-ul-Adha (estimated)",
    };

    const banglaDigits = { 0: "০", 1: "১", 2: "২", 3: "৩", 4: "৪", 5: "৫", 6: "৬", 7: "৭", 8: "৮", 9: "৯" };
    function toBn(n) { return String(n).replace(/[0-9]/g, (d) => banglaDigits[d]); }
    function fmtNum(n) { return getLang() === "en" ? String(n) : toBn(n); }
    function monthName(i) { return getLang() === "en" ? GREG_MONTHS_EN[i] : GREG_MONTHS_BN[i]; }
    function hijriMonthName(i) { return getLang() === "en" ? HIJRI_MONTHS_EN[i] : HIJRI_MONTHS_BN[i]; }
    function eventName(bnName) { return getLang() === "en" ? EVENT_NAME_EN[bnName] || bnName : bnName; }

    function renderToday() {
      const h = todayHijri();
      const hijriSuffix = getLang() === "en" ? " AH" : " হিজরি";
      document.getElementById("todayHijri").textContent = fmtNum(h.day) + " " + hijriMonthName(h.month - 1) + ", " + fmtNum(h.year) + hijriSuffix;
      const g = new Date();
      document.getElementById("todayGreg").textContent = g.getDate() + " " + monthName(g.getMonth()) + ", " + g.getFullYear();
    }

    function renderEvents() {
      const events = getUpcomingIslamicDates(6);
      document.getElementById("eventList").innerHTML = events
        .map((ev) => {
          const label = ev.daysLeft === 0 ? t("islCalToday") : ev.daysLeft === 1 ? t("islCalTomorrow") : fmtNum(ev.daysLeft) + " " + t("islCalDaysLeft");
          return `
        <div class="event-row">
          <span class="icon">${ev.icon}</span>
          <div style="flex:1;">
            <h4>${eventName(ev.name)}</h4>
            <p>${ev.date.getDate()} ${monthName(ev.date.getMonth())}, ${ev.date.getFullYear()}</p>
          </div>
          <div class="days-badge">${label}</div>
        </div>`;
        })
        .join("");
    }

    renderToday();
    renderEvents();

    (async () => {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      const inst = await getCurrentInstitution();
      if (inst.status !== "ok") return;
      institutionId = inst.id;

      const toggle = document.getElementById("reminderToggle");
      toggle.checked = !!inst.institution.islamic_reminders_enabled;
      toggle.addEventListener("change", async () => {
        const { error } = await db.from("institutions").update({ islamic_reminders_enabled: toggle.checked }).eq("id", institutionId);
        if (error) {
          toggle.checked = !toggle.checked;
          await showAppAlert(t("islCalToggleError") + error.message, "⚠️");
          return;
        }
        if (toggle.checked && (await isPushSubscribed()) === false) {
          await showAppAlert(t("islCalEnablePushHint"), "🔔");
        }
      });
    })();
  </script>
</body>
</html>
