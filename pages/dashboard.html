<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — ড্যাশবোর্ড</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .inst-chip {
      flex: 0 0 auto; display:flex; align-items:center; gap:6px; padding: 8px 14px;
      border-radius: var(--radius-pill); background: var(--surface); border: 1.5px solid var(--border-strong);
      font-size: 13.5px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; cursor: pointer;
    }
    .inst-chip.active { background: var(--teal-800); border-color: var(--teal-800); color: var(--parchment); }
    .inst-chip.add-chip { color: var(--gold-700); border-style: dashed; }
    .qa-btn {
      background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md);
      padding: 14px 8px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
      font-size: 12.5px; font-weight: 600; color: var(--ink);
    }
    .qa-icon { font-size: 22px; }
    .upcoming-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .upcoming-row:last-child { border-bottom:none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header" style="padding-bottom: 40px;">
      <div class="row-between">
        <div>
          <p style="color:rgba(250,246,239,0.75); margin-bottom:2px;" data-i18n="welcomeBack">আসসালামু আলাইকুম,</p>
          <h1 id="userName" style="font-size:22px;">—</h1>
        </div>
        <button id="logoutBtn" title="লগআউট" style="background:rgba(250,246,239,0.12); border:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF6EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div id="instSwitcher" class="chip-row" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:var(--space-4); scrollbar-width:none;"></div>

      <div class="card prayer-widget" id="prayerWidget" onclick="window.location.href='prayer-settings.html'" style="cursor:pointer; background:var(--teal-800); color:var(--parchment);">
        <div class="row-between">
          <div>
            <div class="small" style="opacity:0.8;" data-i18n="nextPrayer">পরবর্তী নামাজ</div>
            <div id="nextPrayerName" style="font-size:19px; font-weight:700; margin-top:2px;">লোড হচ্ছে...</div>
          </div>
          <div id="countdown" style="font-size:24px; font-weight:700; color:var(--gold-500);">--:--</div>
        </div>
        <div id="prayerTimesRow" style="display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-top:14px; border-top:1px solid rgba(250,246,239,0.15); scrollbar-width:none;"></div>
      </div>

      <div class="card" id="azanCard" style="margin-top:16px;">
        <div class="row-between">
          <h3 style="margin:0; font-size:15px;">🕌 <span data-i18n="azanScheduleTitle">আজকের আজানের সময়সূচি</span></h3>
          <span class="small muted" id="hijriDate">···</span>
        </div>
        <div id="azanGrid" style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px; text-align:center;"></div>
        <p class="small muted" style="margin:10px 0 0;" id="azanLocationNote"></p>
      </div>

      <div class="quick-actions" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;">
        <div class="qa-btn" onclick="window.location.href='bayan-form.html'">
          <span class="qa-icon">📖</span><span data-i18n="qaBayan">নতুন বায়ান</span>
        </div>
        <div class="qa-btn" onclick="window.location.href='dawat-form.html'">
          <span class="qa-icon">🍽️</span><span data-i18n="qaDawat">নতুন দাওয়াত</span>
        </div>
        <div class="qa-btn" onclick="window.location.href='finance-form.html'">
          <span class="qa-icon">💰</span><span data-i18n="qaFinance">নতুন লেনদেন</span>
        </div>
      </div>

      <div class="card" id="upcomingCard" style="margin-top:16px; display:none;">
        <h3 style="margin-bottom:10px; font-size:15px;" data-i18n="upcomingDawat">📅 পরবর্তী দাওয়াত</h3>
        <div id="upcomingList"></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="navHome">হোম</span>
      </a>
      <a href="bayan-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="navBayan">বায়ান</span>
      </a>
      <a href="dawat-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="navDawat">দাওয়াত</span>
      </a>
      <a href="finance-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span data-i18n="navFinance">হিসাব</span>
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="navSettings">সেটিংস</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    (async function guard() {
      const user = await getCurrentUser();
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      const name = user.user_metadata && user.user_metadata.full_name ? user.user_metadata.full_name : user.email;
      document.getElementById("userName").textContent = name;

      const inst = await getCurrentInstitution();
      if (inst.status === "error") {
        showConnectionError("প্রতিষ্ঠানের তথ্য লোড করা যায়নি।");
        return;
      }
      if (inst.status === "empty") {
        window.location.replace("institution-setup.html");
        return;
      }
      renderInstitutionSwitcher(inst.all, inst.id);
      loadPrayerWidget(inst.id);
      loadUpcomingDawats(inst.id);
    })();

    async function loadUpcomingDawats(institutionId) {
      const { data } = await db
        .from("dawats")
        .select("id, host_name, dawat_datetime")
        .eq("institution_id", institutionId)
        .eq("status", "upcoming")
        .gte("dawat_datetime", new Date().toISOString())
        .order("dawat_datetime", { ascending: true })
        .limit(3);

      if (!data || data.length === 0) return;

      const months = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
      document.getElementById("upcomingList").innerHTML = data
        .map((d) => {
          const dt = new Date(d.dawat_datetime);
          const dateStr = dt.getDate() + " " + months[dt.getMonth()];
          return `<div class="upcoming-row" onclick="window.location.href='dawat-detail.html?id=${d.id}'" style="cursor:pointer;">
            <span>${d.host_name}</span><span class="muted">${dateStr}</span>
          </div>`;
        })
        .join("");
      document.getElementById("upcomingCard").style.display = "block";
    }

    // ---------- নামাজের সময় widget ----------
    const PRAYER_LABELS = { fajr: "ফজর", zuhr: "যোহর", asr: "আসর", maghrib: "মাগরিব", isha: "ইশা" };
    let prayerSlots = []; // [{ key, label, time: "HH:MM", isJamaat: bool }]
    let countdownTimer = null;

    async function loadPrayerWidget(institutionId) {
      const { data: settings } = await db.from("prayer_settings").select("*").eq("institution_id", institutionId).maybeSingle();
      const { data: inst } = await db.from("institutions").select("latitude, longitude").eq("id", institutionId).single();

      let azanData = null;
      if (inst && inst.latitude && inst.longitude) {
        azanData = await fetchAzanTimes(inst.latitude, inst.longitude);
      }
      renderAzanCard(azanData);

      const azanTimes = azanData ? azanData.timings : null;
      prayerSlots = Object.keys(PRAYER_LABELS).map((key) => {
        const jamaatTime = settings ? settings[key + "_time"] : null;
        const time = jamaatTime ? jamaatTime.slice(0, 5) : (azanTimes ? azanTimes[key] : null);
        return { key, label: PRAYER_LABELS[key], time, isJamaat: !!jamaatTime };
      }).filter((s) => s.time);

      renderPrayerRow();
      if (prayerSlots.length > 0) {
        updateCountdown();
        countdownTimer = setInterval(updateCountdown, 1000);
      } else {
        document.getElementById("nextPrayerName").textContent = "নামাজের সময় সেট করুন";
        document.getElementById("countdown").textContent = "→";
      }
    }

    function renderAzanCard(azanData) {
      const hijriEl = document.getElementById("hijriDate");
      const gridEl = document.getElementById("azanGrid");
      const noteEl = document.getElementById("azanLocationNote");

      if (!azanData) {
        hijriEl.textContent = "";
        gridEl.innerHTML = "";
        noteEl.innerHTML = '📍 <a href="prayer-settings.html" style="color:var(--teal-700); font-weight:600;">অবস্থান সেট করুন</a> — অটো আজানের সময় দেখতে';
        return;
      }
      hijriEl.textContent = azanData.hijri;
      noteEl.textContent = "";
      gridEl.innerHTML = Object.keys(PRAYER_LABELS)
        .map(
          (key) => `
        <div>
          <div class="small muted" style="font-size:11.5px;">${PRAYER_LABELS[key]}</div>
          <div style="font-weight:700; font-size:13px;">${azanData.timings[key]}</div>
        </div>`
        )
        .join("");
    }

    async function fetchAzanTimes(lat, lng) {
      try {
        const cacheKey = "minbar_azan_" + new Date().toDateString();
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);

        const today = new Date();
        const dateStr = String(today.getDate()).padStart(2, "0") + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + today.getFullYear();
        const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lng}&method=1`);
        const json = await res.json();
        const t = json.data.timings;
        const h = json.data.date.hijri;
        const result = {
          timings: { fajr: t.Fajr, zuhr: t.Dhuhr, asr: t.Asr, maghrib: t.Maghrib, isha: t.Isha },
          hijri: h.day + " " + h.month.en + " " + h.year + " হি.",
        };
        sessionStorage.setItem(cacheKey, JSON.stringify(result));
        return result;
      } catch (e) {
        return null;
      }
    }

    function renderPrayerRow() {
      const row = document.getElementById("prayerTimesRow");
      row.innerHTML = prayerSlots
        .map(
          (s) => `
        <div style="flex:0 0 auto; text-align:center; min-width:56px;">
          <div class="small" style="opacity:0.75;">${s.label}</div>
          <div style="font-weight:700; font-size:13.5px; ${s.isJamaat ? "color:var(--gold-500);" : ""}">${s.time}</div>
        </div>`
        )
        .join("");
    }

    function updateCountdown() {
      const now = new Date();
      let next = null;
      let minDiff = Infinity;

      prayerSlots.forEach((s) => {
        const [h, m] = s.time.split(":").map(Number);
        let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
        if (target <= now) target.setDate(target.getDate() + 1);
        const diff = target - now;
        if (diff < minDiff) { minDiff = diff; next = s; }
      });

      if (!next) return;
      const totalSec = Math.floor(minDiff / 1000);
      const hh = Math.floor(totalSec / 3600);
      const mm = Math.floor((totalSec % 3600) / 60);
      const ss = totalSec % 60;

      document.getElementById("nextPrayerName").textContent = next.label + (next.isJamaat ? " (জামাত)" : " (আজান)");
      document.getElementById("countdown").textContent =
        (hh > 0 ? hh + "ঘ " : "") + String(mm).padStart(2, "0") + "মি " + String(ss).padStart(2, "0") + "সে";
    }

    function renderInstitutionSwitcher(institutions, selectedId) {
      const el = document.getElementById("instSwitcher");
      el.innerHTML = "";
      institutions.forEach((inst) => {
        const meta = INSTITUTION_TYPE_META[inst.type] || { icon: "🏷️", label: inst.type };
        const chip = document.createElement("div");
        chip.className = "inst-chip" + (inst.id === selectedId ? " active" : "");
        chip.textContent = meta.icon + " " + inst.name;
        chip.addEventListener("click", () => {
          setSelectedInstitutionId(inst.id);
          window.location.reload();
        });
        el.appendChild(chip);
      });
      const addChip = document.createElement("div");
      addChip.className = "inst-chip add-chip";
      addChip.textContent = t("addInstitution");
      addChip.addEventListener("click", () => (window.location.href = "institution-setup.html"));
      el.appendChild(addChip);
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOutAndRedirect();
    });
  </script>
</body>
</html>
