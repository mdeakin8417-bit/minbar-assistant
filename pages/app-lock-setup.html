<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — অ্যাপ লক সেটআপ</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .method-tabs { display:flex; gap:8px; margin-bottom: var(--space-5); }
    .method-tabs button {
      flex:1; padding: 11px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong);
      background: var(--surface); font-weight:700; color: var(--ink-muted); cursor:pointer;
    }
    .method-tabs button.active { background: var(--teal-800); border-color: var(--teal-800); color: var(--parchment); }

    .pin-dots { display:flex; justify-content:center; gap:14px; margin: 20px 0; }
    .pin-dots span { width:16px; height:16px; border-radius:50%; border:2px solid var(--border-strong); }
    .pin-dots span.filled { background: var(--gold-600); border-color: var(--gold-600); }
    .keypad { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; max-width:280px; margin:0 auto; }
    .keypad button {
      aspect-ratio:1; border-radius:50%; border:1.5px solid var(--border-strong); background:var(--surface);
      font-size:22px; font-weight:600; color:var(--ink); cursor:pointer;
    }
    .keypad button:active { background: var(--surface-sunken); }
    .keypad .empty { visibility:hidden; }

    .pattern-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width:240px; margin: 20px auto; touch-action:none; }
    .pattern-dot {
      width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border-strong); margin:0 auto;
      position:relative; z-index:2;
    }
    .pattern-dot.active { background: var(--gold-600); border-color: var(--gold-600); }
    #patternSvg { position:absolute; top:0; left:0; pointer-events:none; z-index:1; }
    .pattern-wrap { position:relative; }

    .bio-box {
      display:flex; align-items:center; gap:12px; padding:14px; border-radius: var(--radius-md);
      background: var(--surface-sunken); margin-top: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row" style="gap:10px; margin-bottom:6px;">
        <button class="back-btn" onclick="window.location.href='settings.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="margin:0;" data-i18n="lockSetupTitle">অ্যাপ লক সেটআপ</h1>
      </div>
      <p data-i18n="lockSetupSubtitle">আপনার অ্যাপ সুরক্ষিত করুন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="alertBox" class="alert"></div>

        <div class="method-tabs">
          <button type="button" id="tabPin" class="active" data-i18n="pinMethod">🔢 PIN কোড</button>
          <button type="button" id="tabPattern" data-i18n="patternMethod">🔒 প্যাটার্ন</button>
        </div>

        <!-- PIN সেটআপ -->
        <div id="pinSection">
          <p class="small muted text-center" id="pinInstruction">৪ সংখ্যার একটি PIN দিন</p>
          <div class="pin-dots" id="pinDots"></div>
          <div class="keypad" id="pinKeypad"></div>
        </div>

        <!-- প্যাটার্ন সেটআপ -->
        <div id="patternSection" style="display:none;">
          <p class="small muted text-center" id="patternInstruction">কমপক্ষে ৪টি বিন্দু যুক্ত করে প্যাটার্ন আঁকুন</p>
          <div class="pattern-wrap">
            <svg id="patternSvg" width="240" height="240"><line id="patternLine" stroke="var(--gold-600)" stroke-width="3" /></svg>
            <div class="pattern-grid" id="patternGrid"></div>
          </div>
          <button type="button" class="btn btn--ghost" id="resetPatternBtn" style="margin-top:10px;">আবার আঁকুন</button>
        </div>

        <div class="bio-box">
          <span style="font-size:24px;">🔐</span>
          <div style="flex:1;">
            <div style="font-weight:700; font-size:14px;">ফিঙ্গারপ্রিন্ট / ফেস আনলক</div>
            <div class="small muted" id="bioStatus">প্রথমে PIN বা প্যাটার্ন সেট করুন</div>
          </div>
          <button type="button" class="btn btn--ghost" id="enrollBioBtn" style="width:auto; padding:8px 16px;" disabled>যোগ করুন</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    const alertBox = document.getElementById("alertBox");
    function showAlert(m, t) { alertBox.textContent = m; alertBox.className = "alert show alert--" + t; }

    let currentMethod = "pin";
    let pinBuffer = "";
    let firstEntry = null; // প্রথমবার দেওয়া PIN/প্যাটার্ন, কনফার্মেশনের জন্য

    // ---------- ট্যাব সুইচ ----------
    document.getElementById("tabPin").addEventListener("click", () => switchTab("pin"));
    document.getElementById("tabPattern").addEventListener("click", () => switchTab("pattern"));
    function switchTab(method) {
      currentMethod = method;
      firstEntry = null;
      pinBuffer = "";
      document.getElementById("tabPin").classList.toggle("active", method === "pin");
      document.getElementById("tabPattern").classList.toggle("active", method === "pattern");
      document.getElementById("pinSection").style.display = method === "pin" ? "block" : "none";
      document.getElementById("patternSection").style.display = method === "pattern" ? "block" : "none";
      document.getElementById("pinInstruction").textContent = "৪ সংখ্যার একটি PIN দিন";
      document.getElementById("patternInstruction").textContent = "কমপক্ষে ৪টি বিন্দু যুক্ত করে প্যাটার্ন আঁকুন";
      renderPinDots();
      resetPattern();
    }

    // ---------- PIN কীপ্যাড ----------
    const keypad = document.getElementById("pinKeypad");
    const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    keys.forEach((k) => {
      const btn = document.createElement("button");
      if (k === "") { btn.className = "empty"; }
      btn.textContent = k;
      btn.type = "button";
      btn.addEventListener("click", () => handleKey(k));
      keypad.appendChild(btn);
    });

    function renderPinDots() {
      const dotsEl = document.getElementById("pinDots");
      dotsEl.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement("span");
        if (i < pinBuffer.length) dot.classList.add("filled");
        dotsEl.appendChild(dot);
      }
    }

    async function handleKey(k) {
      if (k === "" ) return;
      if (k === "⌫") { pinBuffer = pinBuffer.slice(0, -1); renderPinDots(); return; }
      if (pinBuffer.length >= 4) return;
      pinBuffer += k;
      renderPinDots();
      if (pinBuffer.length === 4) {
        if (!firstEntry) {
          firstEntry = pinBuffer;
          pinBuffer = "";
          document.getElementById("pinInstruction").textContent = "আবার PIN দিয়ে নিশ্চিত করুন";
          setTimeout(renderPinDots, 150);
        } else {
          if (firstEntry === pinBuffer) {
            await savePinOrPattern("pin", firstEntry);
          } else {
            showAlert("দুটো PIN মেলেনি, আবার চেষ্টা করুন।", "error");
            firstEntry = null;
            pinBuffer = "";
            document.getElementById("pinInstruction").textContent = "৪ সংখ্যার একটি PIN দিন";
          }
          setTimeout(renderPinDots, 150);
        }
      }
    }

    // ---------- প্যাটার্ন গ্রিড ----------
    const patternGrid = document.getElementById("patternGrid");
    const dotPositions = [];
    for (let i = 0; i < 9; i++) {
      const dot = document.createElement("div");
      dot.className = "pattern-dot";
      dot.dataset.index = i;
      patternGrid.appendChild(dot);
    }
    let currentPattern = [];
    let isDrawing = false;

    function getDotCenters() {
      return Array.from(document.querySelectorAll(".pattern-dot")).map((d) => {
        const r = d.getBoundingClientRect();
        const wrapR = document.querySelector(".pattern-wrap").getBoundingClientRect();
        return { x: r.left - wrapR.left + r.width / 2, y: r.top - wrapR.top + r.height / 2 };
      });
    }

    function resetPattern() {
      currentPattern = [];
      document.querySelectorAll(".pattern-dot").forEach((d) => d.classList.remove("active"));
      document.getElementById("patternLine").setAttribute("points", "");
      const svg = document.getElementById("patternSvg");
      svg.innerHTML = '<polyline id="patternLine" points="" stroke="var(--gold-600)" stroke-width="3" fill="none" />';
    }
    document.getElementById("resetPatternBtn").addEventListener("click", () => {
      resetPattern();
      firstEntry = null;
      document.getElementById("patternInstruction").textContent = "কমপক্ষে ৪টি বিন্দু যুক্ত করে প্যাটার্ন আঁকুন";
    });

    function addDotToPattern(index, centers) {
      if (currentPattern.includes(index)) return;
      currentPattern.push(index);
      document.querySelectorAll(".pattern-dot")[index].classList.add("active");
      const points = currentPattern.map((i) => centers[i].x + "," + centers[i].y).join(" ");
      document.getElementById("patternLine").setAttribute("points", points);
    }

    function handlePointerMove(e) {
      if (!isDrawing) return;
      const touch = e.touches ? e.touches[0] : e;
      const centers = getDotCenters();
      document.querySelectorAll(".pattern-dot").forEach((dot, i) => {
        const rect = dot.getBoundingClientRect();
        const dx = touch.clientX - (rect.left + rect.width / 2);
        const dy = touch.clientY - (rect.top + rect.height / 2);
        if (Math.sqrt(dx * dx + dy * dy) < 24) addDotToPattern(i, centers);
      });
    }

    async function handlePointerUp() {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentPattern.length < 4) {
        showAlert("কমপক্ষে ৪টি বিন্দু যুক্ত করুন।", "error");
        resetPattern();
        return;
      }
      const patternStr = currentPattern.join("-");
      if (!firstEntry) {
        firstEntry = patternStr;
        document.getElementById("patternInstruction").textContent = "আবার একই প্যাটার্ন আঁকুন";
        setTimeout(resetPattern, 400);
      } else {
        if (firstEntry === patternStr) {
          await savePinOrPattern("pattern", patternStr);
        } else {
          showAlert("প্যাটার্ন মেলেনি, আবার চেষ্টা করুন।", "error");
          firstEntry = null;
          document.getElementById("patternInstruction").textContent = "কমপক্ষে ৪টি বিন্দু যুক্ত করে প্যাটার্ন আঁকুন";
          resetPattern();
        }
      }
    }

    patternGrid.addEventListener("pointerdown", (e) => {
      isDrawing = true;
      handlePointerMove(e);
    });
    document.addEventListener("pointermove", handlePointerMove);
    document.addEventListener("pointerup", handlePointerUp);

    // ---------- সেভ ও বায়োমেট্রিক ----------
    async function savePinOrPattern(method, value) {
      const hash = await sha256Hex(method + ":" + value);
      localStorage.setItem("minbar_lock_method", method);
      localStorage.setItem("minbar_lock_pin_hash", hash);
      localStorage.setItem("minbar_lock_enabled", "1");
      markSessionUnlocked();
      showAlert("লক সেট হয়ে গেছে! ✅", "success");
      document.getElementById("enrollBioBtn").disabled = false;
      document.getElementById("bioStatus").textContent = "এখন ফিঙ্গারপ্রিন্ট/ফেস যোগ করতে পারেন (ঐচ্ছিক)";
    }

    document.getElementById("enrollBioBtn").addEventListener("click", async () => {
      const btn = document.getElementById("enrollBioBtn");
      btn.disabled = true;
      const result = await enrollBiometric();
      btn.disabled = false;
      if (result.status === "ok") {
        document.getElementById("bioStatus").textContent = "✅ বায়োমেট্রিক যোগ হয়েছে";
        showAlert("ফিঙ্গারপ্রিন্ট/ফেস আনলক চালু হয়েছে!", "success");
      } else if (result.status === "unsupported") {
        showAlert("আপনার ফোন/ব্রাউজারে বায়োমেট্রিক সাপোর্ট নেই।", "error");
      } else {
        showAlert("যোগ করা যায়নি, আবার চেষ্টা করুন।", "error");
      }
    });

    renderPinDots();
    if (localStorage.getItem("minbar_lock_enabled") === "1") {
      document.getElementById("enrollBioBtn").disabled = false;
      document.getElementById("bioStatus").textContent = hasBiometricEnrolled() ? "✅ বায়োমেট্রিক ইতিমধ্যে যুক্ত" : "ফিঙ্গারপ্রিন্ট/ফেস যোগ করতে পারেন (ঐচ্ছিক)";
    }

    (async () => {
      const user = await getCurrentUser();
      if (!user) window.location.replace("login.html");
    })();
  </script>
</body>
</html>
