<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — নোটিফিকেশন</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .back-btn-wrap { display:flex; gap:10px; align-items:center; margin-bottom:6px; justify-content:space-between; }
    .notif-row { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer; position:relative; }
    .notif-row:last-child { border-bottom:none; }
    .notif-row.unread { background: rgba(18,56,50,0.05); margin: 0 -16px; padding: 14px 16px; }
    .notif-icon { font-size:22px; flex-shrink:0; }
    .notif-body h4 { margin:0 0 2px; font-size:14.5px; }
    .notif-body p { margin:0; font-size:12.5px; color: var(--ink-muted); }
    .notif-time { font-size:11px; color: var(--ink-muted); white-space:nowrap; margin-top:2px; }
    .unread-dot { width:8px; height:8px; border-radius:50%; background: var(--gold-600); position:absolute; left:2px; top:20px; }
    .mark-all { background:none; border:none; color: var(--teal-700); font-size:13px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row back-btn-wrap">
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <h1 style="margin:0;" data-i18n="notifTitle">🔔 নোটিফিকেশন</h1>
        </div>
        <button class="mark-all" onclick="markAllRead()" data-i18n="notifMarkAll">সব পড়া হয়েছে</button>
      </div>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="notifList"><p class="muted small">লোড হচ্ছে...</p></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }
    function timeAgo(dateStr) {
      const diffMin = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
      if (diffMin < 1) return t("notifJustNow");
      if (diffMin < 60) return diffMin + t("notifMinAgo");
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return diffH + t("notifHourAgo");
      const diffD = Math.round(diffH / 24);
      return diffD + t("notifDayAgo");
    }
    const ICONS = { dawat: "🍽️", prayer: "🕌", islamic_date: "🌙" };

    function relatedUrl(n) {
      if (n.related_type === "dawat" && n.related_id) return "dawat-detail.html?id=" + n.related_id;
      if (n.related_type === "prayer") return "prayer-settings.html";
      if (n.related_type === "islamic_date") return "islamic-calendar.html";
      return null;
    }

    async function loadNotifications() {
      const { data, error } = await db
        .from("notifications")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(50);

      const listEl = document.getElementById("notifList");
      if (error || !data || data.length === 0) {
        listEl.innerHTML = '<p class="muted small text-center" style="padding:20px 0;">' + t("notifEmpty") + "</p>";
        return;
      }

      listEl.innerHTML = data
        .map(
          (n) => `
        <div class="notif-row ${n.is_read ? "" : "unread"}" onclick="openNotification('${n.id}', ${JSON.stringify(relatedUrl(n))})">
          ${!n.is_read ? '<span class="unread-dot"></span>' : ""}
          <div class="notif-icon">${ICONS[n.related_type] || "🔔"}</div>
          <div class="notif-body" style="flex:1;">
            <h4>${escapeHtml(n.title)}</h4>
            <p>${escapeHtml(n.body)}</p>
          </div>
          <div class="notif-time">${timeAgo(n.created_at)}</div>
        </div>`
        )
        .join("");
    }

    async function openNotification(id, url) {
      await db.from("notifications").update({ is_read: true }).eq("id", id);
      if (url) window.location.href = url;
      else loadNotifications();
    }

    async function markAllRead() {
      await db.from("notifications").update({ is_read: true }).eq("is_read", false);
      loadNotifications();
    }

    (async () => {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      loadNotifications();
    })();
  </script>
</body>
</html>
