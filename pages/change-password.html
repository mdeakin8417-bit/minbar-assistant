<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — পাসওয়ার্ড পরিবর্তন</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row" style="gap:10px; margin-bottom:6px;">
        <button class="back-btn" onclick="window.location.href='settings.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="margin:0;" data-i18n="changePasswordTitle">পাসওয়ার্ড পরিবর্তন</h1>
      </div>
      <p data-i18n="changePasswordSubtitle">নতুন পাসওয়ার্ড সেট করুন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="alertBox" class="alert"></div>
        <form id="pwForm" class="stack">
          <div class="field" id="pw1Field">
            <label for="pw1" data-i18n="newPassword">নতুন পাসওয়ার্ড</label>
            <input type="password" id="pw1" placeholder="কমপক্ষে ৬ ক্যারেক্টার" minlength="6" required />
            <div class="field-error">কমপক্ষে ৬ ক্যারেক্টার দিন</div>
          </div>
          <div class="field" id="pw2Field">
            <label for="pw2" data-i18n="confirmPassword">নতুন পাসওয়ার্ড আবার লিখুন</label>
            <input type="password" id="pw2" placeholder="আবার লিখুন" minlength="6" required />
            <div class="field-error">পাসওয়ার্ড মিলছে না</div>
          </div>
          <button type="submit" class="btn btn--primary" id="saveBtn">
            <span class="btn-label" data-i18n="changeBtn">পরিবর্তন করুন</span>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    const alertBox = document.getElementById("alertBox");
    function showAlert(m, t) { alertBox.textContent = m; alertBox.className = "alert show alert--" + t; }

    document.getElementById("pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      const pw1Field = document.getElementById("pw1Field");
      const pw2Field = document.getElementById("pw2Field");

      let hasError = false;
      if (pw1.length < 6) { pw1Field.classList.add("has-error"); hasError = true; } else pw1Field.classList.remove("has-error");
      if (pw1 !== pw2) { pw2Field.classList.add("has-error"); hasError = true; } else pw2Field.classList.remove("has-error");
      if (hasError) return;

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.querySelector(".btn-label").textContent = "পরিবর্তন হচ্ছে...";

      const { error } = await db.auth.updateUser({ password: pw1 });

      btn.disabled = false;
      btn.querySelector(".btn-label").textContent = "পরিবর্তন করুন";

      if (error) {
        showAlert("পরিবর্তন করা যায়নি: " + error.message, "error");
        return;
      }
      showAlert("পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে!", "success");
      document.getElementById("pwForm").reset();
    });

    (async () => {
      const user = await getCurrentUser();
      if (!user) window.location.replace("login.html");
    })();
  </script>
</body>
</html>
