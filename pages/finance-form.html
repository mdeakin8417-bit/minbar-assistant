<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — নতুন লেনদেন</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>    .type-toggle { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: var(--space-4); }
    .type-toggle button {
      padding: 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong);
      background: var(--surface); font-weight:700; font-size:15px; cursor:pointer; color: var(--ink-muted);
    }
    .type-toggle button.active.income { background: var(--income-bg); border-color: var(--income); color: var(--income); }
    .type-toggle button.active.expense { background: var(--expense-bg); border-color: var(--expense); color: var(--expense); }
    .file-drop {
      border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); padding: 16px 14px;
      text-align: center; color: var(--ink-muted); font-size: 14px; cursor: pointer; background: var(--surface-sunken);
    }
    .file-drop.has-file { border-color: var(--gold-600); color: var(--teal-900); font-weight: 600; }

    .cat-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-chip {
      padding: 9px 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-strong);
      background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-muted); cursor: pointer;
    }
    .cat-chip.selected { background: var(--teal-800); border-color: var(--teal-800); color: var(--parchment); }
    .cat-chip.add-chip { border-style: dashed; color: var(--gold-700); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row" style="gap:10px; margin-bottom:6px;">
        <button class="back-btn" onclick="window.location.href='finance-list.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <h1 style="margin:0;" data-i18n="newTransaction">নতুন লেনদেন</h1>
      </div>
      <p id="instLabel">লেনদেনের তথ্য পূরণ করুন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">
      <div class="card" style="box-shadow: var(--shadow-raised);">
        <div id="alertBox" class="alert"></div>

        <div class="type-toggle">
          <button type="button" id="btnIncome" class="income active">💰 <span data-i18n="income">আয়</span></button>
          <button type="button" id="btnExpense" class="expense">💸 <span data-i18n="expense">ব্যয়</span></button>
        </div>

        <form id="txForm" class="stack">
          <div class="field" id="amountField">
            <label for="amount" data-i18n="amount">পরিমাণ (৳)</label>
            <input type="number" id="amount" inputmode="decimal" step="0.01" placeholder="যেমন: ৫০০" required />
            <div class="field-error">সঠিক পরিমাণ দিন</div>
          </div>

          <div class="field">
            <label data-i18n="category">ক্যাটাগরি</label>
            <div class="cat-grid" id="categoryGrid"></div>
            <input type="hidden" id="category" value="" />
          </div>

          <div class="field">
            <label for="description" data-i18n="description">বিবরণ (ঐচ্ছিক)</label>
            <input type="text" id="description" placeholder="যেমন: বিদ্যুৎ বিল আগস্ট" />
          </div>

          <div class="field">
            <label for="txDate" data-i18n="date">তারিখ</label>
            <input type="date" id="txDate" />
          </div>

          <div class="field">
            <label>রসিদ/বিলের ছবি (ঐচ্ছিক)</label>
            <div class="file-drop" id="fileDrop" onclick="document.getElementById('attachment').click();">📎 ফাইল বাছাই করতে চাপুন</div>
            <input type="file" id="attachment" accept="image/*,application/pdf" style="display:none;" />
          </div>

          <button type="submit" class="btn btn--primary" id="saveBtn">
            <span class="btn-label" data-i18n="save">সংরক্ষণ করুন</span>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    let institutionId = null;
    let currentUser = null;
    let txType = "income";

    const alertBox = document.getElementById("alertBox");
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = "alert show alert--" + type;
    }

    document.getElementById("txDate").valueAsDate = new Date();

    function setType(type) {
      txType = type;
      document.getElementById("btnIncome").classList.toggle("active", type === "income");
      document.getElementById("btnExpense").classList.toggle("active", type === "expense");
      loadCategories();
    }
    document.getElementById("btnIncome").addEventListener("click", () => setType("income"));
    document.getElementById("btnExpense").addEventListener("click", () => setType("expense"));

    document.getElementById("attachment").addEventListener("change", (e) => {
      const drop = document.getElementById("fileDrop");
      if (e.target.files[0]) {
        drop.textContent = "✅ " + e.target.files[0].name;
        drop.classList.add("has-file");
      }
    });

    async function loadCategories() {
      const { data } = await db
        .from("finance_categories")
        .select("id, name")
        .eq("institution_id", institutionId)
        .eq("type", txType)
        .order("name");
      renderCategoryChips(data || []);
    }

    function renderCategoryChips(categories) {
      const grid = document.getElementById("categoryGrid");
      const hiddenInput = document.getElementById("category");
      hiddenInput.value = "";
      grid.innerHTML = "";

      categories.forEach((cat) => {
        const chip = document.createElement("div");
        chip.className = "cat-chip";
        chip.textContent = cat.name;
        chip.dataset.id = cat.id;
        chip.addEventListener("click", () => selectCategoryChip(chip));
        grid.appendChild(chip);
      });

      const addChip = document.createElement("div");
      addChip.className = "cat-chip add-chip";
      addChip.textContent = "➕ নতুন";
      addChip.addEventListener("click", addNewCategory);
      grid.appendChild(addChip);
    }

    function selectCategoryChip(chip) {
      document.querySelectorAll(".cat-chip").forEach((c) => c.classList.remove("selected"));
      chip.classList.add("selected");
      document.getElementById("category").value = chip.dataset.id;
    }

    async function addNewCategory() {
      const name = await showAppPrompt("নতুন ক্যাটাগরির নাম লিখুন:", "🏷️", "যেমন: যাতায়াত খরচ");
      if (!name || !name.trim()) return;
      const { data, error } = await db
        .from("finance_categories")
        .insert({ institution_id: institutionId, name: name.trim(), type: txType })
        .select()
        .single();
      if (error) { showAlert("ক্যাটাগরি যোগ করা যায়নি: " + error.message, "error"); return; }
      await loadCategories();
      const newChip = Array.from(document.querySelectorAll(".cat-chip")).find((c) => c.dataset.id === data.id);
      if (newChip) selectCategoryChip(newChip);
    }

    document.getElementById("txForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const amountField = document.getElementById("amountField");
      const amount = parseFloat(document.getElementById("amount").value);
      if (!amount || amount <= 0) { amountField.classList.add("has-error"); return; }
      amountField.classList.remove("has-error");

      let categoryId = document.getElementById("category").value || null;
      if (categoryId === "__new__") categoryId = null;

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.querySelector(".btn-label").textContent = "সংরক্ষণ হচ্ছে...";

      const { data: tx, error } = await db
        .from("transactions")
        .insert({
          institution_id: institutionId,
          category_id: categoryId,
          type: txType,
          amount,
          description: document.getElementById("description").value.trim() || null,
          transaction_date: document.getElementById("txDate").value || new Date().toISOString().slice(0, 10),
          created_by: currentUser.id,
        })
        .select()
        .single();

      if (error) {
        btn.disabled = false;
        btn.querySelector(".btn-label").textContent = "সংরক্ষণ করুন";
        showAlert("সংরক্ষণ করা যায়নি: " + error.message, "error");
        return;
      }

      const file = document.getElementById("attachment").files[0];
      if (file) {
        const path = institutionId + "/" + tx.id + "/" + Date.now() + "_" + file.name;
        const { error: uploadError } = await db.storage.from("finance-attachments").upload(path, file);
        if (!uploadError) {
          const { data: signedUrlData } = await db.storage.from("finance-attachments").createSignedUrl(path, 60 * 60 * 24 * 365);
          if (signedUrlData) {
            await db.from("transactions").update({ attachment_url: path }).eq("id", tx.id);
          }
        }
      }

      window.location.href = "finance-list.html";
    });

    (async () => {
      currentUser = await getCurrentUser();
      if (!currentUser) { window.location.replace("login.html"); return; }
      const inst = await getCurrentInstitution();
      if (inst.status === "error") { showConnectionError("প্রতিষ্ঠানের তথ্য লোড করা যায়নি।"); return; }
      if (inst.status === "empty") { window.location.replace("institution-setup.html"); return; }
      institutionId = inst.id;
      document.getElementById("instLabel").textContent = inst.institution.name + " — এর জন্য লেনদেন যোগ করুন";
      await loadCategories();
    })();
  </script>
</body>
</html>
