<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — AI সহকারী</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    html, body { height: 100%; }
    .chat-shell { display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; background:var(--parchment); }
    .chat-header {
      background: var(--teal-800); color: var(--parchment); padding: 16px 18px;
      display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    .chat-header h1 { color: var(--parchment); font-size:18px; margin:0; }
    .chat-body { flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: var(--radius-md); font-size: 14.5px; line-height:1.6; white-space:pre-wrap; }
    .msg.user { align-self:flex-end; background: var(--teal-800); color: var(--parchment); border-bottom-right-radius:4px; }
    .msg.assistant { align-self:flex-start; background: var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg.system { align-self:center; background: var(--surface-sunken); color: var(--ink-muted); font-size:13px; text-align:center; }
    .typing-dots { display:flex; gap:4px; padding: 4px 0; }
    .typing-dots span { width:6px; height:6px; border-radius:50%; background: var(--ink-faint); animation: blink 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    .chat-input-bar {
      flex-shrink:0; display:flex; gap:8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .chat-input-bar textarea {
      flex:1; resize:none; border:1.5px solid var(--border-strong); border-radius: var(--radius-md);
      padding: 10px 14px; font-family: var(--font-body); font-size: 15px; max-height: 100px; background:var(--surface); color:var(--ink);
    }
    .send-btn {
      width:44px; height:44px; border-radius:50%; background: var(--gold-600); color: var(--teal-900);
      border:none; font-size:18px; cursor:pointer; flex-shrink:0;
    }
    .send-btn:disabled { opacity:0.5; }
    .empty-hint { text-align:center; color: var(--ink-muted); padding: 40px 20px; }
    .suggestion-chip {
      display:inline-block; margin: 4px; padding: 8px 14px; border-radius: var(--radius-pill);
      background: var(--surface); border: 1.5px solid var(--border-strong); font-size: 13px; cursor:pointer;
    }
    .mode-row { display:flex; gap:6px; padding: 10px 12px 0; flex-shrink:0; background: var(--teal-800); }
    .mode-chip {
      flex:1; text-align:center; padding:7px 4px; border-radius: var(--radius-pill); font-size:12px; font-weight:600;
      background: rgba(250,246,239,0.12); color: var(--parchment); cursor:pointer; opacity:0.75;
    }
    .mode-chip.active { background: var(--gold-600); color: var(--teal-900); opacity:1; }
  </style>
</head>
<body>
  <div class="chat-shell">
    <div class="chat-header">
      <button class="back-btn" onclick="window.location.href='settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 data-i18n="aiChatTitle">🤖 AI সহকারী</h1>
    </div>

    <div class="mode-row">
      <div class="mode-chip active" data-mode="imam" onclick="switchMode('imam')" data-i18n="aiModeImam">🕌 ইমাম সহকারী</div>
      <div class="mode-chip" data-mode="bayan" onclick="switchMode('bayan')" data-i18n="aiModeBayan">📖 বায়ান সহকারী</div>
      <div class="mode-chip" data-mode="qa" onclick="switchMode('qa')" data-i18n="aiModeQa">❓ ইসলামিক প্রশ্নোত্তর</div>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="empty-hint" id="emptyHint"></div>
    </div>

    <div class="chat-input-bar">
      <textarea id="msgInput" rows="1" placeholder="আপনার প্রশ্ন লিখুন..." data-i18n-placeholder="aiChatPlaceholder"></textarea>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    let conversationId = null;
    let institutionId = null;
    let currentMode = "imam";

    const MODE_CONTENT = {
      imam: {
        greeting: {
          bn: "আসসালামু আলাইকুম! আমি আপনার দৈনন্দিন কাজে সাহায্য করতে পারি — আজকের দাওয়াত, এই মাসের হিসাব, বা যেকোনো পরামর্শ জিজ্ঞেস করুন।",
          en: "Assalamu Alaikum! I can help with your day-to-day tasks — ask about today's Dawats, this month's finances, or anything else.",
        },
        suggestions: {
          bn: ["আজ আমার কী কী কাজ আছে?", "এই মাসের হিসাব কেমন যাচ্ছে?"],
          en: ["What's on my plate today?", "How are this month's finances looking?"],
        },
      },
      bayan: {
        greeting: {
          bn: "বায়ান লেখায় সাহায্য দরকার? বিষয় বলুন — কুরআন-হাদিসের রেফারেন্সসহ একটা কাঠামো বানিয়ে দেব। আপনার আগের বায়ানের ধরন মাথায় রেখেই লিখব।",
          en: "Need help writing a Bayan? Give me a topic and I'll build a structure with Quran/Hadith references, keeping your usual style in mind.",
        },
        suggestions: {
          bn: ["জুমার বায়ানের একটা বিষয় সাজেস্ট করো", "সবরের ওপর একটা ছোট বায়ানের খসড়া লিখে দাও"],
          en: ["Suggest a topic for a Jumma Bayan", "Draft a short Bayan on patience (sabr)"],
        },
      },
      qa: {
        greeting: {
          bn: "ইসলামিক যেকোনো প্রশ্ন করুন — দলিলসহ উত্তর দেওয়ার চেষ্টা করব, আর যেখানে ফিকহি মতভেদ আছে সেটাও জানিয়ে দেব। জটিল মাসয়ালায় স্থানীয় আলেমের সাথে যাচাই করে নেবেন।",
          en: "Ask any Islamic question — I'll try to answer with evidence, and flag where scholars differ. For complex matters, please verify with a local scholar.",
        },
        suggestions: {
          bn: ["রোজা অবস্থায় ভুলে কিছু খেয়ে ফেললে কী হবে?", "যাকাতের নিসাব কীভাবে ঠিক হয়?"],
          en: ["What if I accidentally eat while fasting?", "How is the Zakat Nisab determined?"],
        },
      },
    };

    function renderEmptyHint() {
      const lang = getLang() === "en" ? "en" : "bn";
      const m = MODE_CONTENT[currentMode];
      document.getElementById("emptyHint").innerHTML = `
        <div style="font-size:36px; margin-bottom:8px;">🤖</div>
        <p>${m.greeting[lang]}</p>
        <div style="margin-top:10px;">
          ${m.suggestions[lang].map((s) => `<span class="suggestion-chip" onclick="sendSuggestion(this)">${s}</span>`).join("")}
        </div>`;
      document.getElementById("emptyHint").style.display = "block";
    }

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      conversationId = null; // মোড বদলালে নতুন কথোপকথন শুরু হবে, যাতে সিস্টেম নির্দেশনা মিশে না যায়
      document.querySelectorAll(".mode-chip").forEach((c) => c.classList.toggle("active", c.dataset.mode === mode));
      document.getElementById("chatBody").innerHTML = '<div class="empty-hint" id="emptyHint"></div>';
      renderEmptyHint();
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    function addMessage(role, text) {
      document.getElementById("emptyHint").style.display = "none";
      const body = document.getElementById("chatBody");
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      body.appendChild(el);
      body.scrollTop = body.scrollHeight;
      return el;
    }

    function addTypingIndicator() {
      const body = document.getElementById("chatBody");
      const el = document.createElement("div");
      el.className = "msg assistant";
      el.id = "typingIndicator";
      el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      body.appendChild(el);
      body.scrollTop = body.scrollHeight;
    }
    function removeTypingIndicator() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      addMessage("user", text);
      document.getElementById("msgInput").value = "";
      document.getElementById("sendBtn").disabled = true;
      addTypingIndicator();

      try {
        const { data, error } = await db.functions.invoke("ai-chat", {
          body: { message: text, conversationId, institutionId, mode: currentMode },
        });

        removeTypingIndicator();
        document.getElementById("sendBtn").disabled = false;

        if (error) {
          addMessage("system", "সংযোগে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
          return;
        }
        if (data.conversationId) conversationId = data.conversationId;
        if (data.error) {
          addMessage("system", data.error);
          return;
        }
        addMessage("assistant", data.reply);
      } catch (e) {
        removeTypingIndicator();
        document.getElementById("sendBtn").disabled = false;
        addMessage("system", "সংযোগে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
      }
    }

    function sendSuggestion(el) {
      sendMessage(el.textContent);
    }

    document.getElementById("sendBtn").addEventListener("click", () => {
      sendMessage(document.getElementById("msgInput").value);
    });
    document.getElementById("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(document.getElementById("msgInput").value);
      }
    });
    document.getElementById("msgInput").addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 100) + "px";
    });

    (async () => {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      const aiOn = await isAiEnabled();
      if (!aiOn) { window.location.replace("ai-premium.html"); return; }
      const inst = await getCurrentInstitution();
      if (inst.status === "ok") institutionId = inst.id;
      renderEmptyHint();
    })();
  </script>
</body>
</html>
