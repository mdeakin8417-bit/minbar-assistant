<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — আমল ট্র্যাকার</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .back-btn-wrap { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
    .streak-card {
      display:flex; align-items:center; justify-content:space-between; padding:16px;
      border-radius: var(--radius-lg); background: var(--teal-800); color: var(--parchment); margin-bottom: var(--space-4);
    }
    .streak-flame { font-size:28px; }
    .streak-num { font-size:22px; font-weight:700; color: var(--gold-500); }
    .progress-track { height:8px; border-radius:999px; background: rgba(250,246,239,0.18); margin-top:10px; overflow:hidden; }
    .progress-fill { height:100%; background: var(--gold-500); border-radius:999px; transition: width 0.3s; }

    .evening-banner {
      background: var(--surface-sunken); border-radius: var(--radius-md); padding:14px; text-align:center;
      font-size:13.5px; color: var(--ink-muted); margin-bottom: var(--space-4);
    }
    .evening-banner a { color: var(--teal-700); font-weight:700; cursor:pointer; }

    .amal-card { margin-bottom: var(--space-3); }
    .amal-title-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .amal-title { font-weight:700; font-size:15.5px; }
    .amal-target { font-size:12.5px; color: var(--ink-muted); margin-top:2px; }
    .amal-del { color: var(--ink-faint); font-size:16px; cursor:pointer; padding:4px; }

    .checkin-row { display:flex; gap:10px; margin-top:12px; }
    .checkin-btn {
      flex:1; padding:11px; border-radius: var(--radius-md); border:1.5px solid var(--border-strong);
      background: var(--surface); font-weight:700; font-size:14px; cursor:pointer; color: var(--ink);
    }
    .checkin-btn.yes { border-color: var(--income); color: var(--income); }
    .checkin-btn.no { border-color: var(--expense); color: var(--expense); }

    .status-pill { display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; font-weight:700; padding:6px 12px; border-radius:999px; }
    .status-pill.done { background: var(--income-bg); color: var(--income); }
    .status-pill.missed { background: var(--expense-bg); color: var(--expense); }
    .status-pill .redo { margin-left:auto; font-weight:600; color: var(--ink-faint); cursor:pointer; font-size:12px; }

    .week-row { display:flex; gap:5px; margin-top:12px; justify-content:space-between; }
    .week-dot { flex:1; text-align:center; }
    .week-dot .lbl { font-size:10.5px; color: var(--ink-faint); margin-bottom:4px; }
    .week-dot .dot { width:20px; height:20px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; background: var(--surface-sunken); }
    .week-dot .dot.done { background: var(--income); color:#fff; }
    .week-dot .dot.missed { background: var(--expense); color:#fff; }

    .backlog-card { border: 1.5px dashed var(--gold-600); }
    .add-form .field { margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row back-btn-wrap">
        <button class="back-btn" onclick="window.location.href='settings.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h1 style="margin:0;">🤲 আমল ট্র্যাকার</h1>
      </div>
      <p>প্রতিদিনের ইবাদতের ধারাবাহিকতা ধরে রাখুন</p>
    </header>

    <main class="screen" style="margin-top:-24px;">

      <div class="streak-card" id="streakCard">
        <div>
          <div class="small" style="opacity:0.8;">ধারাবাহিক দিন</div>
          <div><span class="streak-flame">🔥</span> <span class="streak-num" id="streakNum">০</span> <span class="small" style="opacity:0.85;">দিন</span></div>
        </div>
        <div style="text-align:left; min-width:110px;">
          <div class="small" style="opacity:0.8;" id="todayProgressLabel">আজ ০/০ সম্পন্ন</div>
          <div class="progress-track"><div class="progress-fill" id="todayProgressFill" style="width:0%;"></div></div>
        </div>
      </div>

      <div id="eveningBanner" class="evening-banner" style="display:none;">
        সন্ধ্যার পরে আজকের আমল যাচাই করাই ভালো।
        <a id="checkNowLink">এখনই যাচাই করতে চাই</a>
      </div>

      <div id="backlogSection"></div>

      <div id="goalsSection"></div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <p>এখনো কোনো আমল যোগ করা হয়নি।</p>
      </div>

      <button class="btn btn--ghost mt-4" id="addGoalToggleBtn" style="width:100%;">+ নতুন আমল যোগ করুন</button>

      <div class="card add-form" id="addGoalForm" style="display:none; margin-top:12px;">
        <div class="field">
          <label>আমলের নাম</label>
          <input type="text" id="newGoalTitle" placeholder="যেমন: দরূদ শরীফ" />
        </div>
        <div class="field">
          <label>দৈনিক টার্গেট (ঐচ্ছিক)</label>
          <input type="text" id="newGoalTarget" placeholder="যেমন: ৫০০ বার / ৫ পৃষ্ঠা" />
        </div>
        <div class="row" style="gap:10px;">
          <button class="btn btn--ghost" style="flex:1;" id="cancelAddGoalBtn">বাতিল</button>
          <button class="btn btn--primary" style="flex:1;" id="saveGoalBtn">যোগ করুন</button>
        </div>
      </div>

      <div class="section-title" style="margin-top:28px;">এই সপ্তাহের অগ্রগতি</div>
      <div id="weeklySection"></div>

    </main>

    <nav class="bottom-nav">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    const BN_DAY_LETTERS = ["র", "সো", "ম", "বু", "বৃ", "শু", "শ"]; // রবি..শনি
    let currentUserId = null;
    let allGoals = [];
    let logsByGoal = {}; // goalId -> { "YYYY-MM-DD": true/false }
    let forceShowToday = false;

    function todayStr(offsetDays) {
      const d = new Date();
      if (offsetDays) d.setDate(d.getDate() + offsetDays);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    (async function guard() {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      currentUserId = user.id;
      await loadAll();
    })();

    async function loadAll() {
      const { data: goals, error: gErr } = await db
        .from("amal_goals")
        .select("id, title, target_label, is_active, created_at")
        .eq("is_active", true)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
      if (gErr) { showConnectionError("আমলের তথ্য লোড করা যায়নি।"); return; }
      allGoals = goals || [];

      if (allGoals.length === 0) {
        document.getElementById("emptyState").style.display = "block";
        document.getElementById("goalsSection").innerHTML = "";
        document.getElementById("weeklySection").innerHTML = "";
        renderStreakCard(0, 0, 0);
        return;
      }
      document.getElementById("emptyState").style.display = "none";

      // গত ১০ দিনের সব লগ একসাথে আনা (ব্যাকলগ + স্ট্রিক + সাপ্তাহিক হিসাবের জন্য যথেষ্ট)
      const since = todayStr(-9);
      const { data: logs } = await db
        .from("amal_logs")
        .select("goal_id, log_date, completed")
        .eq("user_id", currentUserId)
        .gte("log_date", since);

      logsByGoal = {};
      allGoals.forEach((g) => (logsByGoal[g.id] = {}));
      (logs || []).forEach((l) => {
        if (!logsByGoal[l.goal_id]) logsByGoal[l.goal_id] = {};
        logsByGoal[l.goal_id][l.log_date] = l.completed;
      });

      renderEveningBanner();
      renderBacklog();
      renderGoals();
      renderStreak();
      renderWeekly();
    }

    function renderEveningBanner() {
      const hour = new Date().getHours();
      const banner = document.getElementById("eveningBanner");
      if (hour < 18 && !forceShowToday) {
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }
    document.getElementById("checkNowLink").addEventListener("click", () => {
      forceShowToday = true;
      document.getElementById("eveningBanner").style.display = "none";
      renderGoals();
    });

    function goalCreatedDateStr(goal) {
      const d = new Date(goal.created_at);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // ---------- আজকের চেকইন লিস্ট ----------
    function renderGoals() {
      const hour = new Date().getHours();
      const showToday = hour >= 18 || forceShowToday;
      const today = todayStr(0);

      const html = allGoals
        .map((g) => {
          const log = logsByGoal[g.id] ? logsByGoal[g.id][today] : undefined;
          const answered = log !== undefined;

          let body;
          if (!showToday) {
            body = `<p class="small muted" style="margin:10px 0 0;">সন্ধ্যার পরে আজকের অবস্থা যাচাই করুন।</p>`;
          } else if (!answered) {
            body = `
              <div class="checkin-row">
                <button class="checkin-btn yes" onclick="answerToday('${g.id}', true)">হ্যাঁ, সম্পন্ন হয়েছে</button>
                <button class="checkin-btn no" onclick="answerToday('${g.id}', false)">না</button>
              </div>`;
          } else {
            body = `
              <div class="status-pill ${log ? "done" : "missed"}">
                ${log ? "✅ আজ সম্পন্ন হয়েছে" : "❌ আজ হয়নি"}
                <span class="redo" onclick="answerToday('${g.id}', ${!log})">পরিবর্তন করুন</span>
              </div>`;
          }

          return `
            <div class="card amal-card">
              <div class="amal-title-row">
                <div>
                  <div class="amal-title">${escapeHtml(g.title)}</div>
                  ${g.target_label ? `<div class="amal-target">🎯 ${escapeHtml(g.target_label)}</div>` : ""}
                </div>
                <span class="amal-del" onclick="deleteGoal('${g.id}')">🗑️</span>
              </div>
              ${body}
            </div>`;
        })
        .join("");

      document.getElementById("goalsSection").innerHTML = html;
    }

    async function answerToday(goalId, completed) {
      const today = todayStr(0);
      const { error } = await db.from("amal_logs").upsert(
        { user_id: currentUserId, goal_id: goalId, log_date: today, completed, answered_at: new Date().toISOString() },
        { onConflict: "goal_id,log_date" }
      );
      if (error) { await showAppAlert("সেভ করা যায়নি, আবার চেষ্টা করুন।", "⚠️"); return; }
      if (!logsByGoal[goalId]) logsByGoal[goalId] = {};
      logsByGoal[goalId][today] = completed;
      renderGoals();
      renderStreak();
      renderWeekly();
    }

    // ---------- মিস হওয়া গতকাল/আগের দিনের এন্ট্রি (সর্বোচ্চ ২ দিন পেছনে) ----------
    function renderBacklog() {
      const today = todayStr(0);
      const items = [];
      for (let back = 1; back <= 2; back++) {
        const dateStr = todayStr(-back);
        allGoals.forEach((g) => {
          if (goalCreatedDateStr(g) > dateStr) return; // আমলটা তখনো তৈরি হয়নি
          const log = logsByGoal[g.id] ? logsByGoal[g.id][dateStr] : undefined;
          if (log === undefined) items.push({ goal: g, dateStr, back });
        });
      }

      if (items.length === 0) {
        document.getElementById("backlogSection").innerHTML = "";
        return;
      }

      const dayLabel = (back) => (back === 1 ? "গতকাল" : "তার আগের দিন");

      document.getElementById("backlogSection").innerHTML = `
        <div class="card backlog-card">
          <div class="row-between" style="margin-bottom:8px;">
            <strong style="font-size:14px;">⏳ মিস হওয়া এন্ট্রি পূরণ করুন</strong>
          </div>
          ${items
            .map(
              (it) => `
            <div class="row-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
              <span class="small">${escapeHtml(it.goal.title)} — ${dayLabel(it.back)}</span>
              <div style="display:flex; gap:6px;">
                <button class="btn btn--ghost" style="padding:6px 12px; font-size:12.5px;" onclick="answerBacklog('${it.goal.id}','${it.dateStr}',true)">হ্যাঁ</button>
                <button class="btn btn--ghost" style="padding:6px 12px; font-size:12.5px;" onclick="answerBacklog('${it.goal.id}','${it.dateStr}',false)">না</button>
              </div>
            </div>`
            )
            .join("")}
        </div>`;
    }

    async function answerBacklog(goalId, dateStr, completed) {
      const { error } = await db.from("amal_logs").upsert(
        { user_id: currentUserId, goal_id: goalId, log_date: dateStr, completed, answered_at: new Date().toISOString() },
        { onConflict: "goal_id,log_date" }
      );
      if (error) { await showAppAlert("সেভ করা যায়নি, আবার চেষ্টা করুন।", "⚠️"); return; }
      if (!logsByGoal[goalId]) logsByGoal[goalId] = {};
      logsByGoal[goalId][dateStr] = completed;
      renderBacklog();
      renderStreak();
      renderWeekly();
    }

    // ---------- স্ট্রিক ও আজকের প্রোগ্রেস ----------
    function renderStreak() {
      const today = todayStr(0);
      let doneToday = 0;
      allGoals.forEach((g) => {
        if (logsByGoal[g.id] && logsByGoal[g.id][today] === true) doneToday++;
      });

      // ধারাবাহিক দিন হিসাব: আজ থেকে পেছনের দিকে, যতদিন ওই দিনে বিদ্যমান সব আমল সম্পন্ন হয়েছে
      let streak = 0;
      for (let back = 0; back < 60; back++) {
        const dateStr = todayStr(-back);
        const activeGoalsThatDay = allGoals.filter((g) => goalCreatedDateStr(g) <= dateStr);
        if (activeGoalsThatDay.length === 0) break;
        const allDone = activeGoalsThatDay.every((g) => logsByGoal[g.id] && logsByGoal[g.id][dateStr] === true);
        if (back === 0 && !allDone) continue; // আজকেরটা এখনো অসম্পূর্ণ/অনুত্তরিত হতে পারে, তাই আজ বাদ দিয়ে গতকাল থেকে গোনা শুরু
        if (!allDone) break;
        streak++;
      }

      renderStreakCard(streak, doneToday, allGoals.length);
    }

    function renderStreakCard(streak, done, total) {
      document.getElementById("streakNum").textContent = toBn(streak);
      document.getElementById("todayProgressLabel").textContent = `আজ ${toBn(done)}/${toBn(total)} সম্পন্ন`;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById("todayProgressFill").style.width = pct + "%";
    }

    function toBn(n) {
      const map = { 0: "০", 1: "১", 2: "২", 3: "৩", 4: "৪", 5: "৫", 6: "৬", 7: "৭", 8: "৮", 9: "৯" };
      return String(n).replace(/[0-9]/g, (d) => map[d]);
    }

    // ---------- সাপ্তাহিক অগ্রগতি (গত ৭ দিন) ----------
    function renderWeekly() {
      if (allGoals.length === 0) { document.getElementById("weeklySection").innerHTML = ""; return; }

      const days = [];
      for (let back = 6; back >= 0; back--) {
        const d = new Date();
        d.setDate(d.getDate() - back);
        days.push({ dateStr: todayStr(-back), weekday: d.getDay() });
      }

      const html = allGoals
        .map((g) => {
          const dots = days
            .map((day) => {
              const created = goalCreatedDateStr(g) > day.dateStr;
              const log = logsByGoal[g.id] ? logsByGoal[g.id][day.dateStr] : undefined;
              let cls = "";
              let mark = "·";
              if (!created) {
                if (log === true) { cls = "done"; mark = "✓"; }
                else if (log === false) { cls = "missed"; mark = "✕"; }
              }
              return `<div class="week-dot"><div class="lbl">${BN_DAY_LETTERS[day.weekday]}</div><div class="dot ${cls}">${mark}</div></div>`;
            })
            .join("");
          return `<div class="card"><div class="small" style="font-weight:700; margin-bottom:2px;">${escapeHtml(g.title)}</div><div class="week-row">${dots}</div></div>`;
        })
        .join("");

      document.getElementById("weeklySection").innerHTML = html;
    }

    // ---------- নতুন আমল যোগ করা ----------
    const addForm = document.getElementById("addGoalForm");
    document.getElementById("addGoalToggleBtn").addEventListener("click", () => {
      addForm.style.display = addForm.style.display === "none" ? "block" : "none";
    });
    document.getElementById("cancelAddGoalBtn").addEventListener("click", () => {
      addForm.style.display = "none";
      document.getElementById("newGoalTitle").value = "";
      document.getElementById("newGoalTarget").value = "";
    });
    document.getElementById("saveGoalBtn").addEventListener("click", async () => {
      const title = document.getElementById("newGoalTitle").value.trim();
      const target = document.getElementById("newGoalTarget").value.trim();
      if (!title) { await showAppAlert("আমলের নাম দিন।", "⚠️"); return; }

      const { error } = await db.from("amal_goals").insert({
        user_id: currentUserId,
        title,
        target_label: target || null,
        sort_order: allGoals.length,
      });
      if (error) { await showAppAlert("যোগ করা যায়নি, আবার চেষ্টা করুন।", "⚠️"); return; }

      document.getElementById("newGoalTitle").value = "";
      document.getElementById("newGoalTarget").value = "";
      addForm.style.display = "none";
      await loadAll();
    });

    async function deleteGoal(goalId) {
      const ok = await showAppConfirm("এই আমলটি ও এর সব হিস্ট্রি মুছে ফেলতে চান?", "🗑️");
      if (!ok) return;
      const { error } = await db.from("amal_goals").delete().eq("id", goalId);
      if (error) { await showAppAlert("মুছে ফেলা যায়নি।", "⚠️"); return; }
      await loadAll();
    }
  </script>
</body>
</html>
