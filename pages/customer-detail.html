<!doctype html>
<html lang="bn">
<head>
  <script>try{if(localStorage.getItem("minbar_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <script>try{if(localStorage.getItem("minbar_lock_enabled")==="1"&&sessionStorage.getItem("minbar_unlocked")!=="1"){var p=window.location.pathname.split("/").pop();window.location.replace("lock.html?redirect="+encodeURIComponent(p));}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minbar Assistant — কাস্টমার হিসাব</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#123832" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>    .icon-btn { background: rgba(250,246,239,0.12); border:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--parchment); }
    .big-amt { font-size: 30px; font-weight: 700; text-align:center; margin: 6px 0; }
    .action-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin: var(--space-4) 0; }
    .tx-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); }
    .tx-row:last-child { border-bottom:none; }
    .tx-row .amt.due { color: var(--expense); font-weight:700; }
    .tx-row .amt.payment { color: var(--income); font-weight:700; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="arch-header">
      <div class="row-between">
        <button class="back-btn" onclick="window.location.href='customers-list.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <button class="icon-btn" id="deleteBtn" title="মুছুন">🗑️</button>
      </div>
      <h1 id="cName" style="margin-top:8px;">লোড হচ্ছে...</h1>
      <p id="cPhone"></p>
    </header>

    <main class="screen" style="margin-top:-20px;">
      <div class="card">
        <div class="small text-center muted" data-i18n="currentDue">বর্তমান বাকি</div>
        <div class="big-amt" id="balanceAmt">৳০</div>
      </div>

      <div class="action-row">
        <button class="btn btn--secondary" id="addDueBtn" data-i18n="addDue">➕ নতুন বাকি</button>
        <button class="btn btn--primary" id="addPaymentBtn" data-i18n="addPayment">✅ টাকা পেয়েছি</button>
      </div>

      <h3 data-i18n="transactionHistory">লেনদেনের ইতিহাস</h3>
      <div class="card">
        <div id="txHistory"><p class="muted small">লোড হচ্ছে...</p></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    applyTranslations();
    const params = new URLSearchParams(window.location.search);
    const customerId = params.get("id");
    let institutionId = null;

    function escapeHtml(str) { const d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }
    function formatMoney(n) { return "৳" + Number(n || 0).toLocaleString("en-BD"); }
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const months = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
      return d.getDate() + " " + months[d.getMonth()];
    }

    async function load() {
      const { data: c, error } = await db.from("customers").select("*").eq("id", customerId).single();
      if (error || !c) { window.location.href = "customers-list.html"; return; }
      institutionId = c.institution_id;
      document.getElementById("cName").textContent = c.name;
      document.getElementById("cPhone").textContent = c.phone || "";

      const { data: txs } = await db
        .from("customer_transactions")
        .select("*")
        .eq("customer_id", customerId)
        .order("transaction_date", { ascending: false });

      const balance = (txs || []).reduce((s, t) => s + (t.type === "due" ? Number(t.amount) : -Number(t.amount)), 0);
      document.getElementById("balanceAmt").textContent = formatMoney(balance);
      document.getElementById("balanceAmt").style.color = balance > 0 ? "var(--expense)" : "var(--income)";

      const historyEl = document.getElementById("txHistory");
      if (!txs || txs.length === 0) {
        historyEl.innerHTML = '<p class="muted small">এখনো কোনো লেনদেন নেই।</p>';
      } else {
        historyEl.innerHTML = txs
          .map(
            (t) => `<div class="tx-row">
              <span>${formatDate(t.transaction_date)} ${t.note ? "— " + escapeHtml(t.note) : ""}</span>
              <span class="amt ${t.type}">${t.type === "due" ? "+" : "-"}${formatMoney(t.amount)}</span>
            </div>`
          )
          .join("");
      }
    }

    async function addTransaction(type) {
      const amountStr = await showAppPrompt(type === "due" ? "কত টাকা বাকি রাখলেন?" : "কত টাকা পেয়েছেন?", "৳", "যেমন: ৫০০");
      if (!amountStr) return;
      const amount = parseFloat(amountStr);
      if (!amount || amount <= 0) { await showAppAlert("সঠিক পরিমাণ দিন।", "⚠️"); return; }
      const note = (await showAppPrompt("নোট (ঐচ্ছিক):", "📝", "যেমন: চাল কেনার জন্য")) || null;

      await db.from("customer_transactions").insert({
        customer_id: customerId,
        institution_id: institutionId,
        type,
        amount,
        note,
      });
      load();
    }

    document.getElementById("addDueBtn").addEventListener("click", () => addTransaction("due"));
    document.getElementById("addPaymentBtn").addEventListener("click", () => addTransaction("payment"));

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!(await showAppConfirm("এই কাস্টমারকে মুছে ফেলতে চান? সব লেনদেনও মুছে যাবে।", "🗑️"))) return;
      await db.from("customers").delete().eq("id", customerId);
      window.location.href = "customers-list.html";
    });

    (async () => {
      const user = await getCurrentUser();
      if (!user) { window.location.replace("login.html"); return; }
      await load();
    })();
  </script>
</body>
</html>
